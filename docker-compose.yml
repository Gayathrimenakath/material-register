services:
  db:
    image: postgres:17
    container_name: material-register-db
    restart: unless-stopped
    env_file:
      - backend/.env
    ports:
      - "127.0.0.1:5432:5432" # reachable from your own computer only, not from the network
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: